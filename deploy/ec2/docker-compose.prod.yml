name: twenty-ec2

services:
  server:
    image: ${TWENTY_IMAGE}
    ports:
      - '${TWENTY_HOST_PORT:-3000}:3000'
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      PG_SSL_ALLOW_SELF_SIGNED: ${PG_SSL_ALLOW_SELF_SIGNED:-true}
      PGSSLMODE: ${PGSSLMODE:-require}
      REDIS_URL: ${REDIS_URL}
      SERVER_URL: ${SERVER_URL}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-true}

      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}

      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-true}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}
      STORAGE_S3_PRESIGNED_URL_EXPIRES_IN: ${STORAGE_S3_PRESIGNED_URL_EXPIRES_IN:-900}
    volumes:
      - system-alerts:/app/packages/twenty-server/.local-storage/system-alerts
    healthcheck:
      test: curl --fail --max-time 4 http://localhost:3000/healthz/ready
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  worker:
    image: ${TWENTY_IMAGE}
    command: ['yarn', 'worker:prod']
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      PG_SSL_ALLOW_SELF_SIGNED: ${PG_SSL_ALLOW_SELF_SIGNED:-true}
      PGSSLMODE: ${PGSSLMODE:-require}
      REDIS_URL: ${REDIS_URL}
      SERVER_URL: ${SERVER_URL}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-true}

      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}

      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-true}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}
      STORAGE_S3_PRESIGNED_URL_EXPIRES_IN: ${STORAGE_S3_PRESIGNED_URL_EXPIRES_IN:-900}
    depends_on:
      server:
        condition: service_healthy
    restart: always

  system-alert-monitor:
    image: ${TWENTY_IMAGE}
    entrypoint: ['node', 'scripts/system-alerts/monitor.cjs']
    environment:
      SYSTEM_ALERT_API_URL: http://server:3000/healthz/ready
      SERVER_URL: ${SERVER_URL}
      SYSTEM_ALERT_SMTP_HOST: ${SYSTEM_ALERT_SMTP_HOST:-}
      SYSTEM_ALERT_SMTP_PORT: ${SYSTEM_ALERT_SMTP_PORT:-587}
      SYSTEM_ALERT_SMTP_USER: ${SYSTEM_ALERT_SMTP_USER:-}
      SYSTEM_ALERT_SMTP_PASSWORD: ${SYSTEM_ALERT_SMTP_PASSWORD:-}
      SYSTEM_ALERT_FROM_ADDRESS: ${SYSTEM_ALERT_FROM_ADDRESS:-}
    volumes:
      - system-alerts:/app/packages/twenty-server/.local-storage/system-alerts
    restart: always

volumes:
  system-alerts:
