name: Database Backup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing CRM deployment environment
        required: true
        default: staging
        type: choice
        options: [dev, staging, prod]
      operation:
        description: Install daily 03:00 KST / 30-day retention, run now, or inspect
        required: true
        default: status
        type: choice
        options: [status, install, run]

permissions:
  contents: read
  id-token: write

concurrency:
  group: database-backup-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/twenty/deploy/ec2' }}
      BACKUP_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Authenticate using existing deployment role
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?}" "${AWS_ROLE_ARN:?}" "${EC2_INSTANCE_ID:?}"
          response="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token_file="${RUNNER_TEMP}/aws-web-identity-token"
          jq -r '.value' <<<"${response}" >"${token_file}"
          chmod 600 "${token_file}"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=${token_file}" >>"${GITHUB_ENV}"
      - name: Run backup operation on the existing host
        shell: bash
        run: |
          set -euo pipefail
          runner_b64="$(base64 -w 0 deploy/ec2/scripts/backup-database.py)"
          installer_b64="$(base64 -w 0 deploy/ec2/scripts/install-database-backup.sh)"
          parameters="$(jq -n --arg dir "${EC2_APP_DIR}" --arg runner "${runner_b64}" --arg installer "${installer_b64}" --arg op "${BACKUP_OPERATION}" '
            {executionTimeout:["10200"], commands: (["set -eu"] +
              (if $op == "install" then [
                "cd " + ($dir | @sh),
                "printf %s " + ($runner | @sh) + " | base64 -d > scripts/backup-database.py",
                "printf %s " + ($installer | @sh) + " | base64 -d > scripts/install-database-backup.sh",
                "python3 scripts/backup-database.py configure-retention --env-file docker-compose.env",
                "bash scripts/install-database-backup.sh"
              ] elif $op == "run" then [
                "systemctl start twenty-db-backup.service"
              ] elif $op == "status" then [] else error("Invalid operation") end) + [
                "systemctl list-timers twenty-db-backup.timer --no-pager",
                "systemctl show twenty-db-backup.service -p LoadState -p ActiveState -p Result -p ExecMainStatus",
                "journalctl -u twenty-db-backup.service -n 30 --no-pager",
                "if test -f /var/lib/twenty-db-backup/last-success.json; then cat /var/lib/twenty-db-backup/last-success.json; fi"
              ])}')"
          command_id="$(aws ssm send-command --instance-ids "${EC2_INSTANCE_ID}" --document-name AWS-RunShellScript --comment "CRM database backup ${BACKUP_OPERATION}" --parameters "${parameters}" --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"
          # Poll only this command. A failed install never gets reported as activated.
          for attempt in $(seq 1 680); do
            if result="$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --output json 2>/dev/null)"; then
              status="$(jq -r '.Status' <<<"${result}")"
              case "${status}" in
                Success) jq '{Status,StandardOutputContent,StandardErrorContent}' <<<"${result}"; exit 0 ;;
                Failed|Cancelled|TimedOut|Cancelling) jq '{Status,StandardOutputContent,StandardErrorContent}' <<<"${result}"; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo 'Timed out waiting; inspect the SSM command and service before retrying.' >&2
          exit 1
